<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemma 4 Chat</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface-hover: #252525;
    --border: #2a2a2a;
    --text: #e8e8e8;
    --text-muted: #888;
    --accent: #6c9eff;
    --accent-dim: #3d6cbf;
    --user-bg: #1e3a5f;
    --assistant-bg: #1a1a1a;
    --radius: 12px;
    --max-width: 800px;
  }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  /* ---- Header ---- */
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  header h1 span { color: var(--accent); }

  .header-actions {
    display: flex;
    gap: 8px;
  }

  .btn-icon {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 36px;
    height: 36px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: all 0.15s;
  }

  .btn-icon:hover { background: var(--surface-hover); color: var(--text); }

  .btn-icon.active { color: var(--accent); border-color: var(--accent-dim); }

  #mic-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 48px;
    height: 48px;
    border-radius: var(--radius);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: all 0.15s;
    flex-shrink: 0;
  }

  #mic-btn:hover { background: var(--surface-hover); color: var(--text); }
  #mic-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  #mic-btn.recording {
    background: #7f1d1d;
    border-color: #ef4444;
    color: #fff;
    animation: pulse 1.2s ease-in-out infinite;
  }

  @keyframes pulse {
    50% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0.25); }
  }

  /* ---- Settings Panel ---- */
  .settings-panel {
    display: none;
    border-bottom: 1px solid var(--border);
    padding: 20px 24px;
    background: var(--surface);
  }

  .settings-panel.open { display: block; }

  .settings-inner {
    max-width: var(--max-width);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .setting-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .setting-group textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14px;
    resize: vertical;
    min-height: 60px;
  }

  .setting-group textarea:focus { outline: 1px solid var(--accent); border-color: var(--accent); }

  .slider-row {
    display: flex;
    gap: 24px;
  }

  .slider-group {
    flex: 1;
  }

  .slider-group label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .slider-group label span { color: var(--text); font-variant-numeric: tabular-nums; }

  .slider-group input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }

  /* ---- Layout: sidebar + chat ---- */
  .main-row {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  .chat-column {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  /* ---- Voice Sidebar ---- */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    background: var(--surface);
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
  }

  .sidebar-title {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    padding: 0 4px;
  }

  .voice-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .voice-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    border: 1px solid transparent;
    overflow: hidden;
  }

  .voice-item:hover { background: var(--surface-hover); }

  .voice-item.selected {
    background: var(--user-bg);
    color: var(--accent);
    border-color: var(--accent-dim);
  }

  .voice-item .voice-name {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .voice-del {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 15px;
    padding: 0 2px;
    visibility: hidden;
  }

  .voice-item:hover .voice-del { visibility: visible; }
  .voice-del:hover { color: #ef4444; }

  #record-voice-btn {
    background: var(--surface-hover);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
  }

  #record-voice-btn:hover { border-color: var(--accent); }
  #record-voice-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  #record-voice-btn.recording {
    background: #7f1d1d;
    border-color: #ef4444;
    color: #fff;
    animation: pulse 1.2s ease-in-out infinite;
  }

  .voice-hint {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.5;
    padding: 0 4px;
  }

  /* ---- Chat Area ---- */
  .chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    scroll-behavior: smooth;
  }

  .chat-messages {
    max-width: var(--max-width);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .message {
    display: flex;
    gap: 12px;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message-avatar {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .message.user .message-avatar {
    background: var(--user-bg);
    color: var(--accent);
  }

  .message.assistant .message-avatar {
    background: linear-gradient(135deg, #4285f4, #ea4335, #fbbc04, #34a853);
    color: white;
    font-size: 12px;
  }

  .message-content {
    flex: 1;
    min-width: 0;
  }

  .message-role {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .message-body {
    font-size: 15px;
    line-height: 1.7;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  .message-body p { margin-bottom: 8px; }
  .message-body p:last-child { margin-bottom: 0; }

  .message-body pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    overflow-x: auto;
    margin: 8px 0;
    font-size: 13px;
    line-height: 1.5;
  }

  .message-body code {
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    font-size: 0.9em;
  }

  .message-body :not(pre) > code {
    background: var(--surface-hover);
    padding: 2px 6px;
    border-radius: 4px;
  }

  .cursor-blink {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--accent);
    margin-left: 2px;
    animation: blink 0.8s step-end infinite;
    vertical-align: text-bottom;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .welcome {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-muted);
  }

  .welcome h2 {
    font-size: 24px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
  }

  .welcome p { font-size: 15px; }

  /* ---- Input Area ---- */
  .input-area {
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    flex-shrink: 0;
  }

  .input-inner {
    max-width: var(--max-width);
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  .input-wrapper {
    flex: 1;
    position: relative;
  }

  #chat-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 12px 16px;
    font-family: inherit;
    font-size: 15px;
    resize: none;
    min-height: 48px;
    max-height: 200px;
    line-height: 1.5;
    transition: border-color 0.15s;
  }

  #chat-input:focus { outline: none; border-color: var(--accent); }
  #chat-input::placeholder { color: var(--text-muted); }

  #send-btn {
    background: var(--accent);
    border: none;
    color: #fff;
    width: 48px;
    height: 48px;
    border-radius: var(--radius);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: background 0.15s;
    flex-shrink: 0;
  }

  #send-btn:hover { background: var(--accent-dim); }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .input-hint {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 8px;
  }

  /* ---- Status ---- */
  .status-bar {
    font-size: 12px;
    color: var(--text-muted);
    padding: 4px 24px;
    text-align: center;
    flex-shrink: 0;
  }

  .status-bar.error { color: #ef4444; }
  .status-bar.connected { color: #22c55e; }
</style>
</head>
<body>

<header>
  <h1><span>Gemma 4</span> &nbsp;E4B Chat</h1>
  <div class="header-actions">
    <button class="btn-icon" id="voice-toggle" title="Speak replies aloud">&#128266;</button>
    <button class="btn-icon" id="settings-toggle" title="Settings">&#9881;</button>
    <button class="btn-icon" id="clear-chat" title="Clear chat">&#8634;</button>
  </div>
</header>

<div class="settings-panel" id="settings-panel">
  <div class="settings-inner">
    <div class="setting-group">
      <label for="system-prompt">System Prompt</label>
      <textarea id="system-prompt" rows="2">You are a helpful assistant.</textarea>
    </div>
    <div class="slider-row">
      <div class="slider-group">
        <label>Temperature <span id="temp-val">0.7</span></label>
        <input type="range" id="temperature" min="0" max="2" step="0.05" value="0.7">
      </div>
      <div class="slider-group">
        <label>Max Tokens <span id="tokens-val">2048</span></label>
        <input type="range" id="max-tokens" min="64" max="8192" step="64" value="2048">
      </div>
    </div>
    <div class="setting-group">
      <label for="api-url">API Endpoint</label>
      <textarea id="api-url" rows="1" style="min-height: 36px;">/v1/chat/completions</textarea>
    </div>
    <div class="setting-group">
      <label for="voice-url">Voice Server (Parakeet STT + Chatterbox TTS)</label>
      <textarea id="voice-url" rows="1" style="min-height: 36px;">http://127.0.0.1:8090</textarea>
    </div>
  </div>
</div>

<div class="status-bar" id="status-bar">Checking server connection...</div>

<div class="main-row">

<aside class="sidebar">
  <div class="sidebar-title">Voices</div>
  <div class="voice-list" id="voice-list"></div>
  <button id="record-voice-btn">&#9210; Record new voice</button>
  <div class="voice-hint">Record ~10 seconds of natural speech and Chatterbox will clone the voice for replies.</div>
</aside>

<div class="chat-column">

<div class="chat-container" id="chat-container">
  <div class="chat-messages" id="chat-messages">
    <div class="welcome">
      <h2>Gemma 4 E4B Playground</h2>
      <p>Running locally on your machine. Start a conversation below.</p>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-inner">
    <div class="input-wrapper">
      <textarea id="chat-input" placeholder="Send a message..." rows="1"></textarea>
    </div>
    <button id="mic-btn" title="Hold a conversation — click to talk">&#127908;</button>
    <button id="send-btn" title="Send">&#9654;</button>
  </div>
  <div class="input-hint">Enter to send &middot; Shift+Enter for new line &middot; &#127908; to talk</div>
</div>

</div><!-- /.chat-column -->
</div><!-- /.main-row -->

<script>
const $ = (sel) => document.querySelector(sel);
const chatMessages = $('#chat-messages');
const chatContainer = $('#chat-container');
const chatInput = $('#chat-input');
const sendBtn = $('#send-btn');
const statusBar = $('#status-bar');
const settingsPanel = $('#settings-panel');
const tempSlider = $('#temperature');
const tokensSlider = $('#max-tokens');
const tempVal = $('#temp-val');
const tokensVal = $('#tokens-val');

const micBtn = $('#mic-btn');
const voiceToggle = $('#voice-toggle');

let conversationHistory = [];
let isGenerating = false;
let abortController = null;

// --- Voice state ---
let voiceServerUp = false;
let speechEnabled = localStorage.getItem('speechEnabled') !== 'false';
let speechEpoch = 0;        // bumped to cancel queued/playing speech
let speechCursor = 0;       // chars of the streaming reply already spoken
let playChain = Promise.resolve();
let currentAudio = null;
let mediaRecorder = null;

const voiceUrl = () => $('#voice-url').value.trim().replace(/\/$/, '');

function renderVoiceToggle() {
  voiceToggle.innerHTML = speechEnabled ? '&#128266;' : '&#128263;';
  voiceToggle.classList.toggle('active', speechEnabled);
  voiceToggle.title = speechEnabled ? 'Voice replies on — click to mute' : 'Voice replies off — click to unmute';
}

voiceToggle.addEventListener('click', () => {
  speechEnabled = !speechEnabled;
  localStorage.setItem('speechEnabled', speechEnabled);
  if (!speechEnabled) stopSpeech();
  renderVoiceToggle();
});

renderVoiceToggle();

// --- Voice library (sidebar) ---
const voiceList = $('#voice-list');
const recordVoiceBtn = $('#record-voice-btn');
let selectedVoice = localStorage.getItem('selectedVoice') || '';
let voicesLoaded = false;
let voiceRecorder = null;

function selectVoice(name) {
  selectedVoice = name;
  localStorage.setItem('selectedVoice', name);
  voiceList.querySelectorAll('.voice-item').forEach(el =>
    el.classList.toggle('selected', el.dataset.voice === name));
}

function renderVoiceList(voices) {
  if (selectedVoice && !voices.includes(selectedVoice)) selectVoice('');
  voiceList.innerHTML = '';
  const addItem = (value, label, deletable) => {
    const item = document.createElement('div');
    item.className = 'voice-item' + (value === selectedVoice ? ' selected' : '');
    item.dataset.voice = value;
    const name = document.createElement('span');
    name.className = 'voice-name';
    name.textContent = label;
    item.appendChild(name);
    if (deletable) {
      const del = document.createElement('button');
      del.className = 'voice-del';
      del.title = 'Delete voice';
      del.innerHTML = '&times;';
      del.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!confirm(`Delete voice "${label}"?`)) return;
        await fetch(voiceUrl() + '/voices/' + encodeURIComponent(value), { method: 'DELETE' }).catch(() => {});
        loadVoices();
      });
      item.appendChild(del);
    }
    item.addEventListener('click', () => selectVoice(value));
    voiceList.appendChild(item);
  };
  addItem('', 'Built-in', false);
  voices.forEach(v => addItem(v, v.replace(/\.wav$/, ''), true));
}

async function loadVoices() {
  try {
    const res = await fetch(voiceUrl() + '/voices');
    if (!res.ok) throw new Error();
    renderVoiceList((await res.json()).voices);
    voicesLoaded = true;
  } catch {
    renderVoiceList([]);
  }
}

renderVoiceList([]);

recordVoiceBtn.addEventListener('click', async () => {
  if (voiceRecorder && voiceRecorder.state === 'recording') {
    voiceRecorder.stop();
    return;
  }
  if (mediaRecorder && mediaRecorder.state === 'recording') return; // chat mic is busy
  const name = (prompt('Name this voice:') || '').trim();
  if (!name) return;
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    statusBar.textContent = `Mic error (${err.name}) — see mic button for help`;
    statusBar.className = 'status-bar error';
    return;
  }
  stopSpeech();
  const mime = ['audio/webm', 'audio/mp4'].find(t => MediaRecorder.isTypeSupported(t)) || '';
  const chunks = [];
  voiceRecorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  voiceRecorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  voiceRecorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    recordVoiceBtn.classList.remove('recording');
    recordVoiceBtn.innerHTML = '&#9210; Record new voice';
    recordVoiceBtn.disabled = true;
    try {
      const type = voiceRecorder.mimeType || mime || 'audio/webm';
      const form = new FormData();
      form.append('name', name);
      form.append('audio', new Blob(chunks, { type }), type.includes('mp4') ? 'clip.m4a' : 'clip.webm');
      const res = await fetch(voiceUrl() + '/voices', { method: 'POST', body: form });
      if (!res.ok) throw new Error((await res.json()).detail || `upload failed (${res.status})`);
      const { voice } = await res.json();
      await loadVoices();
      selectVoice(voice);
      statusBar.textContent = `Voice "${voice.replace(/\.wav$/, '')}" saved and selected`;
      statusBar.className = 'status-bar connected';
    } catch (err) {
      statusBar.textContent = 'Could not save voice: ' + err.message;
      statusBar.className = 'status-bar error';
    } finally {
      recordVoiceBtn.disabled = false;
      voiceRecorder = null;
    }
  };
  voiceRecorder.start();
  recordVoiceBtn.classList.add('recording');
  recordVoiceBtn.innerHTML = '&#9209; Stop &amp; save';
});

// --- Text-to-speech playback queue ---
// Each sentence is fetched as soon as it's enqueued; playback stays strictly
// in order via the promise chain. Bumping speechEpoch discards stale audio.
function speakSentence(text) {
  const epoch = speechEpoch;
  const payload = { text };
  if (selectedVoice) payload.voice = selectedVoice;
  const audioPromise = fetch(voiceUrl() + '/tts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(r => r.ok ? r.blob() : null).catch(() => null);

  playChain = playChain.then(async () => {
    if (epoch !== speechEpoch) return;
    const blob = await audioPromise;
    if (!blob || epoch !== speechEpoch) return;
    await new Promise((resolve) => {
      const audio = new Audio(URL.createObjectURL(blob));
      currentAudio = audio;
      audio.onended = audio.onerror = () => { URL.revokeObjectURL(audio.src); resolve(); };
      audio.play().catch(resolve);
    });
  });
}

function stopSpeech() {
  speechEpoch++;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  playChain = Promise.resolve();
}

// --- Sentence chunking of the streaming reply ---
const fenceBalanced = (text) => ((text.match(/```/g) || []).length % 2) === 0;

function flushSpeech(fullText, final = false) {
  if (!speechEnabled || !voiceServerUp) return;
  let chunk;
  if (final) {
    chunk = fullText.slice(speechCursor);
    speechCursor = fullText.length;
  } else {
    const pending = fullText.slice(speechCursor);
    let cut = -1;
    const re = /[.!?\n](?=[)"'\]]*(\s|$))/g;
    let m;
    while ((m = re.exec(pending)) !== null) cut = m.index + 1;
    if (cut < 0) return;
    // Don't speak while inside an unclosed code block.
    if (!fenceBalanced(fullText.slice(0, speechCursor + cut))) return;
    chunk = pending.slice(0, cut);
    speechCursor += cut;
  }
  const text = chunk.trim();
  if (text) speakSentence(text);
}

// --- Microphone -> Parakeet STT ---
async function startRecording() {
  let stream;
  try {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new DOMException('Page must be served from http://127.0.0.1:8080', 'SecurityError');
    }
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    const hints = {
      NotAllowedError: 'Mic blocked. If you allowed it on the page, macOS is blocking the browser: System Settings → Privacy & Security → Microphone → enable your browser, then restart it.',
      NotFoundError: 'No microphone detected — check input devices in System Settings → Sound.',
      NotReadableError: 'Microphone is in use by another app.',
    };
    statusBar.textContent = hints[err.name] || `Mic error (${err.name}): ${err.message}`;
    statusBar.className = 'status-bar error';
    return;
  }
  const mime = ['audio/webm', 'audio/mp4'].find(t => MediaRecorder.isTypeSupported(t)) || '';
  const chunks = [];
  mediaRecorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  mediaRecorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  mediaRecorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    micBtn.classList.remove('recording');
    micBtn.disabled = true;
    statusBar.textContent = 'Transcribing...';
    statusBar.className = 'status-bar';
    try {
      const type = mediaRecorder.mimeType || mime || 'audio/webm';
      const ext = type.includes('mp4') ? 'm4a' : 'webm';
      const form = new FormData();
      form.append('audio', new Blob(chunks, { type }), `clip.${ext}`);
      const res = await fetch(voiceUrl() + '/stt', { method: 'POST', body: form });
      if (!res.ok) throw new Error(`STT failed (${res.status})`);
      const { text } = await res.json();
      if (text) {
        chatInput.value = text;
        if (!isGenerating) sendMessage();
      } else {
        statusBar.textContent = "Didn't catch that — try again";
      }
      checkServer();
    } catch (err) {
      statusBar.textContent = 'Transcription error: ' + err.message;
      statusBar.className = 'status-bar error';
    } finally {
      micBtn.disabled = false;
      mediaRecorder = null;
    }
  };
  mediaRecorder.start();
  micBtn.classList.add('recording');
  micBtn.title = 'Recording — click to stop';
}

micBtn.addEventListener('click', () => {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
  } else if (!micBtn.disabled) {
    stopSpeech();
    startRecording();
  }
});

// --- Settings wiring ---
$('#settings-toggle').addEventListener('click', () => {
  settingsPanel.classList.toggle('open');
});

$('#clear-chat').addEventListener('click', () => {
  stopSpeech();
  conversationHistory = [];
  chatMessages.innerHTML = `
    <div class="welcome">
      <h2>Gemma 4 E4B Playground</h2>
      <p>Running locally on your machine. Start a conversation below.</p>
    </div>`;
  chatInput.focus();
});

tempSlider.addEventListener('input', () => { tempVal.textContent = tempSlider.value; });
tokensSlider.addEventListener('input', () => { tokensVal.textContent = tokensSlider.value; });

// --- Auto-resize textarea ---
chatInput.addEventListener('input', () => {
  chatInput.style.height = 'auto';
  chatInput.style.height = Math.min(chatInput.scrollHeight, 200) + 'px';
});

// --- Send on Enter ---
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!isGenerating) sendMessage();
  }
});

sendBtn.addEventListener('click', () => {
  if (isGenerating) {
    stopGeneration();
  } else {
    sendMessage();
  }
});

// --- Server health check ---
async function checkServer() {
  const apiUrl = $('#api-url').value;
  const url = apiUrl.startsWith('http')
    ? apiUrl.replace('/v1/chat/completions', '/health')
    : '/health';
  try {
    const res = await fetch(url, { signal: AbortSignal.timeout(3000) });
    if (!res.ok) throw new Error('not ok');
    try {
      const v = await fetch(voiceUrl() + '/health', { signal: AbortSignal.timeout(3000) });
      voiceServerUp = v.ok;
    } catch {
      voiceServerUp = false;
    }
    statusBar.textContent = voiceServerUp
      ? 'Connected to llama-server · voice ready'
      : 'Connected to llama-server · voice server offline (text only)';
    statusBar.className = 'status-bar connected';
    micBtn.disabled = !voiceServerUp;
    micBtn.title = voiceServerUp ? 'Hold a conversation — click to talk' : 'Voice server offline';
    recordVoiceBtn.disabled = !voiceServerUp;
    if (voiceServerUp && !voicesLoaded) loadVoices();
  } catch {
    statusBar.textContent = 'Server not running — start it with ./start-server.sh';
    statusBar.className = 'status-bar error';
  }
}

checkServer();
setInterval(checkServer, 10000);

// --- Markdown-lite rendering ---
function renderMarkdown(text) {
  let html = text
    // code blocks
    .replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) =>
      `<pre><code>${escapeHtml(code.trim())}</code></pre>`)
    // inline code
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    // bold
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    // italic
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    // line breaks -> paragraphs
    .split(/\n{2,}/)
    .map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`)
    .join('');
  return html;
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// --- Add message bubble ---
function addMessage(role, content) {
  // Remove welcome screen on first message
  const welcome = chatMessages.querySelector('.welcome');
  if (welcome) welcome.remove();

  const msg = document.createElement('div');
  msg.className = `message ${role}`;

  const avatarLabel = role === 'user' ? 'U' : 'G';
  msg.innerHTML = `
    <div class="message-avatar">${avatarLabel}</div>
    <div class="message-content">
      <div class="message-role">${role === 'user' ? 'You' : 'Gemma 4'}</div>
      <div class="message-body">${role === 'user' ? escapeHtml(content).replace(/\n/g, '<br>') : renderMarkdown(content)}</div>
    </div>`;
  chatMessages.appendChild(msg);
  scrollToBottom();
  return msg;
}

function scrollToBottom() {
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

function stopGeneration() {
  if (abortController) abortController.abort();
  stopSpeech();
  isGenerating = false;
  sendBtn.innerHTML = '&#9654;';
  const cursor = chatMessages.querySelector('.cursor-blink');
  if (cursor) cursor.remove();
}

// --- Send message & stream response ---
async function sendMessage() {
  const text = chatInput.value.trim();
  if (!text) return;

  chatInput.value = '';
  chatInput.style.height = 'auto';

  addMessage('user', text);
  conversationHistory.push({ role: 'user', content: text });

  stopSpeech();
  speechCursor = 0;
  isGenerating = true;
  sendBtn.innerHTML = '&#9632;';
  sendBtn.disabled = false;

  const assistantMsg = addMessage('assistant', '');
  const bodyEl = assistantMsg.querySelector('.message-body');
  bodyEl.innerHTML = '<span class="cursor-blink"></span>';

  const systemPrompt = $('#system-prompt').value.trim();
  const messages = [];
  if (systemPrompt) messages.push({ role: 'system', content: systemPrompt });
  messages.push(...conversationHistory);

  abortController = new AbortController();

  try {
    const res = await fetch($('#api-url').value, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: abortController.signal,
      body: JSON.stringify({
        messages,
        temperature: parseFloat(tempSlider.value),
        max_tokens: parseInt(tokensSlider.value),
        stream: true
      })
    });

    if (!res.ok) {
      const err = await res.text();
      throw new Error(`Server error ${res.status}: ${err}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed || !trimmed.startsWith('data: ')) continue;
        const data = trimmed.slice(6);
        if (data === '[DONE]') continue;

        try {
          const json = JSON.parse(data);
          const delta = json.choices?.[0]?.delta?.content;
          if (delta) {
            fullText += delta;
            flushSpeech(fullText);
            bodyEl.innerHTML = renderMarkdown(fullText) + '<span class="cursor-blink"></span>';
            scrollToBottom();
          }
        } catch { /* skip malformed chunks */ }
      }
    }

    flushSpeech(fullText, true);
    bodyEl.innerHTML = renderMarkdown(fullText);
    conversationHistory.push({ role: 'assistant', content: fullText });

  } catch (err) {
    if (err.name === 'AbortError') {
      const partialText = bodyEl.textContent;
      bodyEl.innerHTML = renderMarkdown(partialText);
      if (partialText) conversationHistory.push({ role: 'assistant', content: partialText });
    } else {
      bodyEl.innerHTML = `<p style="color:#ef4444">Error: ${escapeHtml(err.message)}</p>`;
      console.error(err);
    }
  } finally {
    isGenerating = false;
    sendBtn.innerHTML = '&#9654;';
    abortController = null;
    chatInput.focus();
  }
}
</script>
